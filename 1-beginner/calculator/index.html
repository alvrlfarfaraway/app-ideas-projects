<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculator: kalkulator sederhana untuk tambah, kurang, kali, dan bagi hingga 8 digit.">
  <title>Calculator — Kalkulator Sederhana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <p class="eyebrow">App Ideas · Tier 1</p>
      <h1>Calculator</h1>
      <p class="subtitle">Tambah, kurang, kali, dan bagi hingga 8 digit.</p>
    </header>

    <div class="screen">
      <p id="expression" class="expression"></p>
      <output id="display" class="display" aria-live="polite">0</output>
    </div>

    <div id="keypad" class="keypad">
      <button type="button" class="key key-clear" data-key="AC" title="Hapus semua" aria-label="Hapus semua">AC</button>
      <button type="button" class="key key-clear" data-key="C" title="Hapus angka atau operasi terakhir" aria-label="Hapus angka atau operasi terakhir">C</button>
      <button type="button" class="key key-function" data-key="+/-" title="Ubah tanda" aria-label="Ubah tanda">±</button>
      <button type="button" class="key key-operator" data-key="/" aria-label="Bagi">÷</button>

      <button type="button" class="key" data-key="7">7</button>
      <button type="button" class="key" data-key="8">8</button>
      <button type="button" class="key" data-key="9">9</button>
      <button type="button" class="key key-operator" data-key="*" aria-label="Kali">×</button>

      <button type="button" class="key" data-key="4">4</button>
      <button type="button" class="key" data-key="5">5</button>
      <button type="button" class="key" data-key="6">6</button>
      <button type="button" class="key key-operator" data-key="-" aria-label="Kurang">−</button>

      <button type="button" class="key" data-key="1">1</button>
      <button type="button" class="key" data-key="2">2</button>
      <button type="button" class="key" data-key="3">3</button>
      <button type="button" class="key key-operator" data-key="+" aria-label="Tambah">+</button>

      <button type="button" class="key key-zero" data-key="0">0</button>
      <button type="button" class="key" data-key="." aria-label="Titik desimal">.</button>
      <button type="button" class="key key-equals" data-key="=" aria-label="Sama dengan">=</button>
    </div>
  </main>

  <footer class="footer">
    <p class="keyboard-hint">
      Keyboard: angka, <kbd>.</kbd> <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd>,
      <kbd>Enter</kbd> untuk =, <kbd>Backspace</kbd> untuk C, <kbd>Esc</kbd> untuk AC
    </p>
    <p>
      Spesifikasi:
      <a href="https://github.com/florinpop17/app-ideas/blob/master/Projects/1-Beginner/Calculator-App.md">Calculator di app-ideas</a>
    </p>
  </footer>

  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
